<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6A9B4E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Panda Tour">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Panda Adventure · 熊猫川渝行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260728w">
</head>
<body>
  <div class="panda-watermark" aria-hidden="true"></div>

  <aside id="spot-nav" class="spot-nav" aria-label="Spot navigation">
    <div class="spot-nav-inner">
      <div class="spot-nav-title" id="spot-nav-title"></div>
      <div class="spot-nav-list" id="spot-nav-list"></div>
    </div>
  </aside>
  <button type="button" id="spot-nav-toggle" class="spot-nav-toggle" aria-controls="spot-nav" aria-expanded="false">
    <span class="spot-nav-toggle-icon" aria-hidden="true">📍</span>
  </button>

  <aside id="section-nav" class="section-nav" aria-label="Section navigation">
    <div class="section-nav-inner">
      <div class="section-nav-title" id="section-nav-title"></div>
      <nav class="section-nav-list" id="section-nav-list"></nav>
    </div>
  </aside>
  <button type="button" id="section-nav-toggle" class="section-nav-toggle" aria-controls="section-nav" aria-expanded="false">
    <span class="section-nav-toggle-icon" aria-hidden="true">📌</span>
  </button>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <img class="panda-icon" src="images/panda-portrait.png" alt="" aria-hidden="true">
        <div class="logo-text">
          <h1 id="page-title"></h1>
          <p id="page-subtitle" class="subtitle"></p>
        </div>
      </div>
      <p id="traveler-info" class="traveler-badge"></p>
      <div class="header-actions">
        <button id="lang-toggle" class="lang-btn" aria-label="Switch language">
          <span class="lang-en">中文</span>
          <span class="lang-zh">EN</span>
        </button>
        <span class="build-badge" id="build-badge" title="Page version"></span>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- Hero -->
    <section class="hero card" id="hero-section">
      <div class="hero-content">
        <div class="hero-intro">
          <div class="hero-panda">
            <img class="panda-img" src="images/panda-sitting.png" alt="" aria-hidden="true">
          </div>
          <div class="hero-copy">
            <p id="hero-greeting" class="hero-greeting"></p>
            <div class="budget-pills" id="budget-pills"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Highlights -->
    <section class="section" id="highlights-section">
      <div class="section-header">
        <h2 id="highlights-title"></h2>
        <p id="highlights-hint" class="section-desc"></p>
      </div>
      <div class="highlights-grid" id="highlights-grid"></div>
    </section>

    <!-- Hotels -->
    <section class="section" id="hotels-section">
      <h2 id="hotels-title"></h2>
      <div class="hotels-grid" id="hotels-grid"></div>
    </section>

    <!-- Itinerary -->
    <section class="section" id="days-section">
      <div class="section-header">
        <h2 id="days-title"></h2>
        <p id="drill-hint" class="section-desc"></p>
      </div>
      <div class="days-list" id="days-list"></div>
    </section>

    <!-- Budget Breakdown -->
    <section class="section" id="budget-section">
      <div class="budget-panels" id="budget-panels"></div>
    </section>

    <!-- Tips -->
    <section class="section" id="tips-section">
      <div class="section-header">
        <h2 id="tips-title"></h2>
        <p id="tips-hint" class="section-desc"></p>
      </div>
      <div class="tips-grid" id="tips-grid"></div>
    </section>

    <!-- Word Downloads -->
    <section class="section" id="downloads-section">
      <div class="section-header">
        <h2 id="downloads-title"></h2>
        <p id="downloads-hint" class="section-desc"></p>
      </div>
      <div id="downloads-groups"></div>
    </section>
    <!-- Contact -->
    <section class="section" id="contact-section">
      <div class="section-header">
        <h2 id="contact-title"></h2>
        <p id="contact-hint" class="section-desc"></p>
      </div>
      <div id="contact-form-wrap" class="contact-card card"></div>
    </section>

    <!-- PWA install QR (desktop / tablet — scan with phone) -->
    <section class="section install-qr-section" id="install-qr-section">
      <div class="install-qr-compact card">
        <h2 id="install-qr-title" class="install-qr-title"></h2>
        <p id="install-qr-hint" class="install-qr-hint"></p>
        <div class="install-qr-frame">
          <img id="install-qr-image" src="images/install-qr.png" width="132" height="132" alt="">
        </div>
        <a id="install-qr-url" class="install-qr-url" href="" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </section>
  </main>

  <!-- Activity Detail Modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content card">
      <button class="modal-close" data-close aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="footer">
    <p class="exchange-rate" id="exchange-rate"></p>
  </footer>

  <script src="js/data.js?v=20260728w"></script>
  <script src="js/app.js?v=20260728v"></script>
  <script src="js/pwa.js?v=20260727x"></script>
</body>
</html>
